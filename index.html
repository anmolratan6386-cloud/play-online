<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Online - World Movies HD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #0d0d0d;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }
        .player-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
            border: 1px solid #222;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- iFrame Player: dynamic source URL passes through URL parameter 'src' -->
        <iframe id="videoPlayer" src="" allowfullscreen scrolling="no" allow="autoplay; encrypted-media"></iframe>
    </div>

    <script>
        // URL se 'src' parameter read karke iFrame me load karne ka script
        const urlParams = new URLSearchParams(window.location.search);
        const streamUrl = urlParams.get('src');

        if (streamUrl) {
            document.getElementById('videoPlayer').src = decodeURIComponent(streamUrl);
        } else {
            document.querySelector('.player-container').innerHTML = '<p style="text-align:center; padding-top:20%; color:#ff4d4d;">No video source provided!</p>';
        }
    </script>

</body>
</html>
